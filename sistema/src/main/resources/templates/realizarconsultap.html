<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realizar Consulta Médica</title>
    <link rel="stylesheet" href="/css/realizaconsultas.css">
</head>
<body>
    <div class="container">
        <h2>Realizar Consulta Médica</h2>
        <form id="consultation-form">
            <label for="doctor-name">Nome do Médico:</label>
            <input type="text" id="doctor-name" placeholder="Digite o nome do médico" required>

            <label for="specialty">Especialidade:</label>
            <input type="text" id="specialty" placeholder="Especialidade do médico" required>

            <label for="description">Descrição da Consulta:</label>
            <textarea id="description" placeholder="Descreva os sintomas, tratamento, medicamentos, exames..." rows="5" required></textarea>

            <label for="has-insurance">O paciente tem plano de saúde?</label>
            <select id="has-insurance" required>
                <option value="">Selecione</option>
                <option value="yes">Sim</option>
                <option value="no">Não</option>
            </select>

            <div id="payment-details" style="display:none;">
                <label for="payment-amount">Valor da Consulta:</label>
                <input type="number" id="payment-amount" placeholder="Valor a ser pago pelo paciente" readonly>
            </div>

            <button type="submit">Registrar Consulta</button>
        </form>

        <div id="result" style="display:none;">
            <h3>Resultado da Consulta</h3>
            <p><strong>Nome do Médico:</strong> <span id="result-doctor-name"></span></p>
            <p><strong>Especialidade:</strong> <span id="result-specialty"></span></p>
            <p><strong>Descrição:</strong> <span id="result-description"></span></p>
            <p><strong>Valor da Consulta:</strong> R$ <span id="result-payment"></span></p>
        </div>
    </div>

    
</body>
</html>
